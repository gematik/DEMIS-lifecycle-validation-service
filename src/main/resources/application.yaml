spring:
  # Import Base Configuration
  config:
    import: classpath:/base-config-application.yaml
  # Enable Virtual Threads
  threads:
    virtual:
      enabled: true
base:
  errorhandler:
    enabled: false
  feign:
    extension:
      enabled: false
  logging:
    request:
      enabled: true
  meter:
    aspect:
      enabled: true

# Actuator Configuration
management:
  observations:
    key-values:
      application: @project.name@

# Information for the /info Endpoint#
info:
  app:
    name: @project.name@
    version: @project.version@


lvs:
  client:
    dls: "http://destination-lookup-reader.demis.svc.cluster.local"
    futs:
      address: "http://futs.demis.svc.cluster.local"
      context-path: ${DEMIS_NETWORK_FUTS_CONTEXT_PATH:/fhir-ui-data-model-translation/}

  codemapping:
    cache:
      reload:
        cron: "0 0/30 * * * *"

# diesease configuration
disease:
  config: classpath:diseaseConfiguration.json
  config-show-all-scenario-passed: true
  fhir-path-data: configuration/diseaseScenarios.json
  key-to-fhir-path-data: configuration/keyToFhirPath.json

# laboratory configuration
laboratory:
  config-show-all-scenario-passed: true
  fhir-path-data: configuration/laboratoryScenarios.json
  key-to-fhir-path-data: configuration/keyToFhirPath.json

feature:
  flag:
    fhirpath.validation.enabled: false
    return.fhirpath.validation.in.responses: false
    return.disease.fhirpath.validation.in.responses: false

feign:
  client:
    config:
      default:
        retryer: feign.Retryer.Default
        maxAttempts: 3
        period: 100
        maxPeriod: 1000
